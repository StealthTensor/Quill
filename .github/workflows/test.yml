name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        FREELLMAPI_BASE_URL: http://localhost:3001/v1

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff

    - name: Lint with ruff
      run: ruff check . --select=E,F --ignore=E501

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deps
      run: cd web && npm ci

    - name: TypeScript check
      run: cd web && npx tsc --noEmit

    - name: ESLint
      run: cd web && npx eslint src --ext .ts,.tsx --max-warnings 0 || true
