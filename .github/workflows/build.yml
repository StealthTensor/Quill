name: Build Desktop Apps

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Quill-linux
            zip_name: Quill-linux.zip
          - os: windows-latest
            artifact_name: Quill-windows
            zip_name: Quill-windows.zip
          - os: macos-latest
            artifact_name: Quill-macos
            zip_name: Quill-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build Web UI
      run: |
        cd web
        npm ci
        npm run build

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller Quill.spec

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller Quill.spec

    - name: Package (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        zip -r ../${{ matrix.zip_name }} Quill/

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path dist\Quill -DestinationPath ${{ matrix.zip_name }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release'
      with:
        files: ${{ matrix.zip_name }}

    - name: Upload Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.zip_name }}
