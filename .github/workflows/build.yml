name: Build Desktop Apps

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build Web UI
      run: |
        cd web
        npm ci
        npm run build
      
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview fastapi uvicorn requests google-auth-oauthlib google-api-python-client python-docx

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --name Quill --windowed --add-data "web/dist${{ matrix.os == 'windows-latest' && ';' || ':' }}web/dist" desktop.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quill-${{ matrix.os }}
        path: dist/Quill*
