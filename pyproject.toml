[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quill"
version = "1.0.0"
description = "Automated university worksheet filler — scan, generate, upload, submit"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "pywebview>=6.2.0",
    "requests>=2.34.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
quill = "desktop:start_app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
