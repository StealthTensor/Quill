# Quill configuration — copy to config.yaml and fill in your details
# Secrets live in .env, never here.

api:
  base_url: http://localhost:3001/v1   # overridden by FREELLMAPI_BASE_URL if set
  model: gemini-3.5-flash-lite         # fast (~2s/answer); "auto" routes to a huge, slow model
  temperature: 0.85
  max_tokens: 16000
  timeout_seconds: 240
  max_retries: 4
  retry_max_sleep_seconds: 180

run:
  input_dir: input                     # where the .docx worksheets live
  output_dir: output                   # filled copies land in output/<student>/<file>.docx
  cache_dir: .cache                    # answered worksheets are cached so re-runs are free
  workers: 2
  date: ""                             # blank = today's date, or set e.g. "12-08-2026"

answers:
  language: English
  tone: >-
    a second-year engineering student writing honestly in their own words: simple
    direct sentences, concrete everyday examples, no textbook padding
  long_answer_words: [150, 250]
  max_cell_chars: 220
  max_slots_per_request: 20

students:
  - name: Your Name
    reg_no: "RA25XXXXXXXXXXX"
    branch: CSE
    section: A1
    persona: >-
      describe yourself briefly — this shapes how Quill personalizes your answers
  # Add more students below
